<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SupportPilot Login
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div
    class="
        container
        d-flex
        justify-content-center
        align-items-center
    "
    style="min-height: 100vh;"
>

    <div
        class="card shadow-sm"
        style="width: 400px;"
    >

        <div class="card-body p-4">

            <div class="text-center mb-4">

                <h2>
                    🟦 SupportPilot
                </h2>

                <p class="text-muted">
                    AI Ticket Resolution Agent
                </p>

            </div>

            {% if error %}

                <div class="alert alert-danger">
                    {{ error }}
                </div>

            {% endif %}

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Login
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
