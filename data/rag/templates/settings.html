<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportPilot - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">SupportPilot</span>
    <div>
        <span class="text-white me-3">Welcome, {{ username }}</span>
        <a href="/logout" class="btn btn-outline-light">Logout</a>
    </div>
</nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Settings</h2>
            <p class="text-muted mb-0">Review the current application configuration.</p>
        </div>
        <a href="/dashboard" class="btn btn-outline-secondary">Dashboard</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="mb-4">Security</h5>
            <div class="row mb-3">
                <div class="col-sm-5 text-muted">Authentication method</div>
                <div class="col-sm-7">JWT signed with HS256</div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-5 text-muted">Token lifetime</div>
                <div class="col-sm-7">{{ jwt_expiration_minutes }} minutes</div>
            </div>
            <div class="row">
                <div class="col-sm-5 text-muted">Token storage</div>
                <div class="col-sm-7">HttpOnly browser cookie or Bearer header</div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
