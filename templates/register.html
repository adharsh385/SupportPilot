<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | SupportPilot</title>
    <style>
        :root { --ink: #172033; --muted: #687386; --line: #e4e8ef; --blue: #1769e0; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); font: 15px/1.5 Georgia, 'Times New Roman', serif; background: radial-gradient(circle at 12% 10%, #d9f2ff 0, transparent 34%), linear-gradient(135deg, #f8fbff, #eef4f0); }
        .shell { width: min(960px, 100%); display: grid; grid-template-columns: 1.05fr .95fr; overflow: hidden; border: 1px solid var(--line); background: rgba(255,255,255,.92); box-shadow: 0 24px 70px rgba(23,32,51,.13); }
        .intro { padding: 58px; background: #172033; color: white; }
        .mark { display: inline-grid; place-items: center; width: 44px; height: 44px; background: #8de0c0; color: #172033; font: bold 18px Arial, sans-serif; }
        h1 { margin: 72px 0 16px; max-width: 390px; font-size: clamp(36px, 5vw, 62px); line-height: .98; font-weight: normal; }
        .intro p { max-width: 360px; color: #c5d0df; font: 16px/1.6 Arial, sans-serif; }
        .form { padding: 58px; }
        h2 { margin: 0 0 8px; font-size: 30px; font-weight: normal; }
        .subtle { margin: 0 0 25px; color: var(--muted); font: 14px Arial, sans-serif; }
        label { display: block; margin: 16px 0 7px; font: 600 12px Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
        input { width: 100%; padding: 14px 15px; border: 1px solid #cfd6e1; border-radius: 3px; color: var(--ink); font: 15px Arial, sans-serif; }
        input:focus { outline: 3px solid #dceaff; border-color: var(--blue); }
        button { width: 100%; margin-top: 25px; padding: 14px; border: 0; border-radius: 3px; background: var(--blue); color: white; cursor: pointer; font: 700 14px Arial, sans-serif; }
        button:hover { background: #0e51b4; }
        .error { padding: 11px 13px; border-left: 3px solid #db4a4a; background: #fff0f0; color: #9c2d2d; font: 13px Arial, sans-serif; }
        .back { display: block; margin-top: 20px; color: var(--blue); text-align: center; font: 13px Arial, sans-serif; }
        @media (max-width: 720px) { .shell { grid-template-columns: 1fr; } .intro { padding: 34px; } .intro h1 { margin-top: 44px; } .form { padding: 34px; } }
    </style>
</head>
<body>
    <main class="shell">
        <section class="intro">
            <div class="mark">SP</div>
            <h1>Your workspace, your credentials.</h1>
            <p>Create an account to manage tickets, inspect AI resolutions, and monitor your support operations.</p>
        </section>
        <section class="form">
            <h2>Create your account</h2>
            <p class="subtle">Choose the username and password you want to use.</p>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="post">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" minlength="3" required autofocus>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
                <label for="confirm_password">Confirm password</label>
                <input id="confirm_password" name="confirm_password" type="password" minlength="6" autocomplete="new-password" required>
                <button type="submit">Create account</button>
            </form>
            <a class="back" href="{{ url_for('login') }}">Already have an account? Sign in</a>
        </section>
    </main>
</body>
</html>
